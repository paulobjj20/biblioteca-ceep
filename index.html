<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Escolar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>📚 Biblioteca Escolar</h1>
            <p>Sistema de gerenciamento da biblioteca</p>
        </div>
    </header>

    <main class="container">

        <!-- PAINEL -->
        <section class="dashboard">

            <div class="card">
                <span>Livros cadastrados</span>
                <strong id="totalLivros">0</strong>
            </div>

            <div class="card">
                <span>Empréstimos</span>
                <strong id="totalEmprestimos">0</strong>
            </div>

            <div class="card">
                <span>Empréstimos ativos</span>
                <strong id="emprestimosAtivos">0</strong>
            </div>

        </section>


        <section class="grid">

            <!-- CADASTRO DE LIVROS -->
            <div class="section">

                <div class="section-header">
                    <h2>📖 Cadastrar livro</h2>
                </div>

                <form id="formLivro">

                    <div class="form-group">
                        <label for="nomeLivro">
                            Nome do livro
                        </label>

                        <input
                            type="text"
                            id="nomeLivro"
                            placeholder="Digite o nome do livro"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="autorLivro">
                            Autor
                        </label>

                        <input
                            type="text"
                            id="autorLivro"
                            placeholder="Digite o nome do autor"
                            required
                        >
                    </div>


                    <button type="submit" class="btn">
                        Cadastrar livro
                    </button>

                </form>


                <div class="lista-container">

                    <h3>Livros cadastrados</h3>

                    <div id="listaLivros">
                        <!-- Livros inseridos pelo JavaScript -->
                    </div>

                </div>

            </div>


            <!-- EMPRÉSTIMO -->
            <div class="section">

                <div class="section-header">
                    <h2>📚 Novo empréstimo</h2>
                </div>

                <form id="formEmprestimo">

                    <div class="form-group">

                        <label for="livroEmprestimo">
                            Livro
                        </label>

                        <select
                            id="livroEmprestimo"
                            required
                        >

                            <option value="">
                                Selecione um livro
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="nomeAluno">
                            Nome do aluno
                        </label>

                        <input
                            type="text"
                            id="nomeAluno"
                            placeholder="Nome completo"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="turma">
                            Turma
                        </label>

                        <input
                            type="text"
                            id="turma"
                            placeholder="Ex: 8º A"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="aluno@email.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="tempoEmprestimo">
                            Tempo do empréstimo
                        </label>

                        <select
                            id="tempoEmprestimo"
                            required
                        >

                            <option value="">
                                Escolha o período
                            </option>

                            <option value="7">
                                7 dias
                            </option>

                            <option value="14">
                                14 dias
                            </option>

                            <option value="21">
                                21 dias
                            </option>

                            <option value="30">
                                30 dias
                            </option>

                        </select>

                    </div>


                    <button type="submit" class="btn">
                        Registrar empréstimo
                    </button>

                </form>


                <div class="lista-container">

                    <h3>Empréstimos registrados</h3>

                    <div id="listaEmprestimos">
                        <!-- Empréstimos inseridos pelo JavaScript -->
                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Biblioteca Escolar © 2026</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
